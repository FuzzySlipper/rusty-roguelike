[workspace]
members = ["crates/rusty-roguelike"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.98"
axum = "0.8.4"
rusty-engine = { git = "https://github.com/FuzzySlipper/rusty-engine", branch = "main" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6.6", features = ["fs"] }
ts-rs = { version = "11.0.1", features = ["serde-compat"] }
rusty-procgen-preflight = { git = "https://github.com/FuzzySlipper/rusty-procgen", rev = "722e2c479bdf88ab39b66d2d33ab466b698ec7df", package = "rusty-procgen-preflight" }
